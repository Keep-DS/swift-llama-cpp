name: Build llama.xcframework (iOS device + simulator + macOS)

# Builds llama.cpp's own build-xcframework.sh at a release tag and publishes
# the zip as a release asset of this repo, named the way Package.swift
# expects (`<tag>-mtmd/llama-<tag>-mtmd-xcframework.zip`).
#
# Why we host our own build: since ~b10k upstream builds mtmd (multimodal,
# Gemma 4 vision) into llama.framework itself, so the header/CMake patches
# this workflow used to carry are gone. But ggml-org's release zip now ships
# only the iOS device and macOS slices, and the app's unit tests run on the
# iOS Simulator, so we still build the simulator slice ourselves.
#
# After a run: put the printed SHA-256 into Package.swift `llamaChecksum`.

on:
  workflow_dispatch:
    inputs:
      llama_version:
        description: 'llama.cpp build tag to build (e.g. b11669 = v0.7.0)'
        required: true
        default: 'b11669'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    # Needed to let GITHUB_TOKEN create releases on this fork; without this
    # `gh release create` returns HTTP 403 "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          cmake --version
          xcrun --show-sdk-version --sdk iphoneos || true

      - name: Clone llama.cpp at ${{ inputs.llama_version }}
        run: |
          git clone --depth 1 --branch "${{ inputs.llama_version }}" \
            https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Confirm mtmd is built into the framework
        working-directory: llama.cpp
        run: |
          set -euo pipefail
          # Fail fast if a future tag drops mtmd from the stock script.
          for pat in '^LLAMA_BUILD_MTMD=ON$' 'cp tools/mtmd/mtmd\.h ' 'cp tools/mtmd/mtmd-helper\.h ' 'tools/mtmd/\$\{release_dir\}/libmtmd\.a'; do
            if ! grep -qE "$pat" build-xcframework.sh; then
              echo "::error::build-xcframework.sh no longer matches: $pat"
              exit 1
            fi
          done

      - name: Build the xcframework
        working-directory: llama.cpp
        run: |
          ./build-xcframework.sh ios-sim ios-device macos

      - name: Zip the xcframework
        working-directory: llama.cpp
        run: |
          cd build-apple
          # -y keeps the macOS framework's symlinks (same as ggml-org's release).
          zip -r -y "llama-${{ inputs.llama_version }}-mtmd-xcframework.zip" llama.xcframework
          ls -la

      # Belt-and-suspenders: keep the zip as a workflow artifact in case
      # the release-creation step can't write to the repo. Artifacts are
      # downloadable via `gh run download` for up to 90 days.
      - name: Upload xcframework as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ inputs.llama_version }}-mtmd-xcframework
          path: llama.cpp/build-apple/llama-${{ inputs.llama_version }}-mtmd-xcframework.zip
          if-no-files-found: error
          retention-days: 90

      - name: Compute SHA-256 checksum
        id: checksum
        working-directory: llama.cpp/build-apple
        run: |
          CHECKSUM=$(shasum -a 256 "llama-${{ inputs.llama_version }}-mtmd-xcframework.zip" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $CHECKSUM"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: llama.cpp/build-apple
        run: |
          TAG="${{ inputs.llama_version }}-mtmd"
          # --clobber so re-running the workflow with the same inputs updates the asset.
          gh release create "$TAG" \
            "llama-${{ inputs.llama_version }}-mtmd-xcframework.zip" \
            --repo "${{ github.repository }}" \
            --title "llama.cpp ${{ inputs.llama_version }} xcframework (iOS + simulator + macOS)" \
            --notes "llama.cpp ${{ inputs.llama_version }} built with its own build-xcframework.sh for iOS device, iOS Simulator and macOS. Multimodal APIs (mtmd_*) ship inside llama.framework.

            SHA-256: \`${{ steps.checksum.outputs.checksum }}\`" \
            --latest=false \
          || gh release upload "$TAG" \
               "llama-${{ inputs.llama_version }}-mtmd-xcframework.zip" \
               --repo "${{ github.repository }}" \
               --clobber
